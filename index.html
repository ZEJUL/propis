<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }

/* Раскладка: одна колонка под телефон — поле ввода сверху, лист-пропись ниже */
:root {
  --bg: #f3f2ef;        /* фон страницы */
  --panel: #ffffff;     /* панели */
  --fg: #1b1a18;        /* основной текст */
  --muted: #6f6b64;     /* подписи */
  --line: #dcd9d2;      /* границы */
  --accent: #1b1a18;    /* активные элементы — в духе ZM, чёрный */
  --on-accent: #ffffff;
  --paper: #fcfbf8;     /* лист прописи всегда светлый, как карточка */
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --panel: #1e1d1b; --fg: #eeece7; --muted: #a29e96;
    --line: #34322f; --accent: #eeece7; --on-accent: #141412; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --panel: #1e1d1b; --fg: #eeece7; --muted: #a29e96;
  --line: #34322f; --accent: #eeece7; --on-accent: #141412; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--ui);
  font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; font-weight: 500; margin: 0; letter-spacing: 0.01em; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }

textarea {
  width: 100%; min-height: 84px; resize: vertical;
  font: inherit; font-size: 16px; color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Чипы с готовыми шаблонами */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 13px; color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chip:hover { border-color: var(--muted); }

/* Настройки: слайдеры и переключатели */
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 20px; }
.row { display: grid; gap: 4px; min-width: 0; }
.row-top { display: flex; justify-content: space-between; font-size: 13px; }
.row-top b { font-weight: 500; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button {
  flex: 1; font: inherit; font-size: 13px; padding: 8px 6px; border: 0; cursor: pointer;
  background: transparent; color: var(--fg);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.toggles { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.toggles input { accent-color: var(--accent); width: 16px; height: 16px; }

/* Лист прописи */
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
canvas { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Пропись ZM</h1>
    <p class="hint">Great Vibes · эталон для руки</p>
  </header>

  <section class="panel">
    <label class="label" for="txt">Текст</label>
    <textarea id="txt" spellcheck="false">Дорогая Анна,
с благодарностью — Юля</textarea>
    <div class="chips" id="chips"></div>
  </section>


  <div class="sheet"><canvas id="cv" aria-label="Текст шрифтом Great Vibes на линейках прописи"></canvas></div>

  <div class="legend">
    <span><i style="color:#1b1a18"></i>базовая линия</span>
    <span><i style="color:#b0724a"></i>высота строчных</span>
    <span><i style="color:#c9c4ba"></i>верх и низ петель</span>
  </div>

  <section class="panel">
    <div class="controls">
      <div class="row">
        <div class="row-top"><label for="size">Размер</label><b id="sizeOut"></b></div>
        <input id="size" type="range" min="28" max="120" step="1" value="48">
      </div>
      <div class="row">
        <div class="row-top"><label for="slant">Наклон направляющих</label><b id="slantOut"></b></div>
        <input id="slant" type="range" min="0" max="40" step="1" value="28">
      </div>
      <div class="row">
        <span class="row-top">Как показать буквы</span>
        <div class="seg" id="mode">
          <button type="button" data-mode="ink" aria-pressed="true">Чернила</button>
          <button type="button" data-mode="trace" aria-pressed="false">Для обводки</button>
          <button type="button" data-mode="outline" aria-pressed="false">Контур</button>
        </div>
      </div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="gLines" checked>Линейки</label>
      <label><input type="checkbox" id="gSlant" checked>Наклонные</label>
      <label><input type="checkbox" id="gRepeat">Пустая строка под каждой</label>
    </div>
  </section>
</div>

<script>
// ===== Готовые шаблоны: поля сертификата и фразы письма =====
const PRESETS = [
  "Jazz", "Opera", "Sonata", "TPU", "№ 002", "11.09.2026", "ZM-JAZ-CHO-002",
  "Дорогая Анна,", "С благодарностью,\nЮля", "Спасибо, что выбрали ZM",
  "абвгдеёжзийклмнопрстуфхцчшщъыьэюя", "АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ",
  "abcdefghijklmnopqrstuvwxyz", "0123456789"
];

// ===== Элементы страницы =====
const txt = document.getElementById("txt");
const size = document.getElementById("size");
const slant = document.getElementById("slant");
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const gLines = document.getElementById("gLines");
const gSlant = document.getElementById("gSlant");
const gRepeat = document.getElementById("gRepeat");
let mode = "ink";

// Цвета листа (лист всегда светлый, поэтому цвета фиксированы)
const C = { paper: "#fcfbf8", ink: "#1b1a18", trace: "#bdb8ae", base: "#1b1a18", xh: "#b0724a", asc: "#c9c4ba", slant: "#e6e2da" };
const FONT = '"Great Vibes", cursive';

// ===== Сохраняем последний текст на этом телефоне (если браузер разрешает) =====
try { const saved = localStorage.getItem("zm-propis-text"); if (saved) txt.value = saved; } catch (e) {}
function save() { try { localStorage.setItem("zm-propis-text", txt.value); } catch (e) {} }

// ===== Чипы шаблонов =====
const chips = document.getElementById("chips");
PRESETS.forEach(p => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip";
  b.textContent = p.replace("\n", " ");
  b.onclick = () => { txt.value = p; save(); draw(); };
  chips.appendChild(b);
});

// ===== Переключатель режима букв =====
document.querySelectorAll("#mode button").forEach(b => {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll("#mode button").forEach(x => x.setAttribute("aria-pressed", x === b));
    draw();
  };
});

// ===== Перенос слов, если строка не влезает в ширину =====
function wrapLines(text, maxW) {
  const out = [];
  text.split("\n").forEach(par => {
    const words = par.split(" ");
    let line = "";
    words.forEach(w => {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
      else line = test;
    });
    out.push(line);
  });
  return out;
}

// ===== Главная функция: рисуем лист =====
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.parentElement.clientWidth;
  const fs = +size.value;                      // размер шрифта в px
  document.getElementById("sizeOut").textContent = fs + " px";
  document.getElementById("slantOut").textContent = slant.value + "°";

  ctx.font = `${fs}px ${FONT}`;
  // Меряем реальные пропорции шрифта: высота строчных, верх и низ петель
  const xH = ctx.measureText("x").actualBoundingBoxAscent || fs * 0.3;
  const ascH = ctx.measureText("l").actualBoundingBoxAscent || fs * 0.7;
  const descH = ctx.measureText("g").actualBoundingBoxDescent || fs * 0.35;

  const pad = Math.max(16, fs * 0.35);
  let lines = wrapLines(txt.value || " ", cssW - pad * 2);
  if (gRepeat.checked) lines = lines.flatMap(l => [l, ""]); // пустая строка для своей попытки
  const lineH = ascH + descH + fs * 0.35;      // шаг строк
  const cssH = pad * 2 + lines.length * lineH;

  // Чёткость на ретина-экранах
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  cv.style.height = cssH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Фон
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, cssW, cssH);

  // Наклонные направляющие по всему листу
  if (gSlant.checked && +slant.value > 0) {
    const t = Math.tan(slant.value * Math.PI / 180);
    const step = xH * 1.1;
    ctx.strokeStyle = C.slant; ctx.lineWidth = 1;
    for (let x = -cssH * t; x < cssW + cssH * t; x += step) {
      ctx.beginPath(); ctx.moveTo(x, cssH); ctx.lineTo(x + cssH * t, 0); ctx.stroke();
    }
  }

  // Строки текста и линейки
  lines.forEach((line, i) => {
    const base = pad + i * lineH + ascH + fs * 0.1; // базовая линия строки
    if (gLines.checked) {
      hLine(base - ascH, C.asc, 1, cssW);
      hLine(base - xH, C.xh, 1.2, cssW);
      hLine(base, C.base, 1.2, cssW);
      hLine(base + descH, C.asc, 1, cssW);
    }
    ctx.font = `${fs}px ${FONT}`;
    if (mode === "outline") {
      ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(0.6, fs / 90);
      ctx.strokeText(line, pad, base);
    } else {
      ctx.fillStyle = mode === "trace" ? C.trace : C.ink;
      ctx.fillText(line, pad, base);
    }
  });
}

// Горизонтальная линия
function hLine(y, color, w, width) {
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
}

// ===== Ждём загрузки шрифта (с кириллицей), потом рисуем =====
function loadAndDraw() {
  const sample = txt.value + PRESETS.join("");
  document.fonts.load(`40px "Great Vibes"`, sample).then(draw, draw);
}

txt.addEventListener("input", () => { save(); loadAndDraw(); });
[size, slant, gLines, gSlant, gRepeat].forEach(el => el.addEventListener("input", draw));
window.addEventListener("resize", draw);
draw();
loadAndDraw();
document.fonts.ready.then(draw);

</script>

</body>
</html>
